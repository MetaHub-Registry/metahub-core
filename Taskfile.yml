version: '3'

dotenv: ['.env']
tasks:
  git:*:
    vars:
      GCMD: '{{index .MATCH 0}}' 
    cmds:
      - git commit -{{.GCMD}} "{{.CLI_ARGS}}"
      - git push
  rmCnt:
    cmds:
      - for x in $(docker ps -aq);do docker rm -f $x;done
  test:
    cmds: 
      - ./test.sh
  sonar:
    cmds:
      - ./misc/bin/sonar.sh