profile:
  name: aws/broadwell
  actions:
    - name: manifest-filter
      event: post-manifest-list-get
      args:
        select: .manifests .[] .platform .features
        value: cpu:broadwell
    - name: manifest-add
      event: post-manifest-get
      args:
        # This requires a tag
        layerRepository: qnib/layer-awscli:bullseye
        repository: qnib/featuretest