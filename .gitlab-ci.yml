stages:
  - coveragetest
  - build

test:
    stage: coveragetest
    image: registry.gitlab.com/qnib-pub-containers/cicd/golang:1.19.1
    #services:
    #  - docker:20.10.17-dind
    #variables:
    #  DOCKER_HOST: tcp://docker:2375/
    #  DOCKER_DRIVER: overlay2
    script: 
      - go mod tidy
      - go test -short -timeout 60s ./... -coverprofile coverage.txt
      - gocover-cobertura < coverage.txt > coverage.xml
      - gocoverstats -v -f coverage.txt --percent
    coverage: /^Global weighted coverage:\s+(\d+(?:\.\d+)?%)/
    artifacts:
      reports:
        coverage_report:
          coverage_format: cobertura
          path: coverage.xml